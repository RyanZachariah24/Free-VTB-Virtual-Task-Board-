<script>
/* Safe HMR / Proxy WebSocket Shim to eliminate connection rejection errors in preview/proxy environments */
(function() {
  if (typeof window !== 'undefined') {
    const origError = console.error;
    console.error = function(...args) {
      const msg = args.join(' ').toLowerCase();
      if (msg.includes('websocket') || msg.includes('vite:ws') || msg.includes('failed to connect')) return;
      origError.apply(console, args);
    };
    window.addEventListener('unhandledrejection', function(e) {
      const reason = (e.reason?.message || e.reason || '').toString().toLowerCase();
      if (reason.includes('websocket') || reason.includes('failed to fetch')) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  }
})();
</script>

/* ---------- Web Crypto AES-256-GCM Zero-Knowledge Vault ---------- */
function bufToHex(buffer) {
  return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function hexToBuf(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
  return bytes;
}
function bufToBase64(buffer) {
  return window.btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
}
function base64ToBuf(base64) {
  const binary = window.atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function getStoredPassphrase() {
  let saved = localStorage.getItem(VAULT_KEY_STORAGE);
  if (!saved) {
    const randomBytes = new Uint8Array(24);
    window.crypto.getRandomValues(randomBytes);
    saved = bufToHex(randomBytes.buffer);

  return saved;

async function deriveKey(passphrase, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await window.crypto.subtle.importKey(
    'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return window.crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptData(data, customPass) {
  try {
    const pass = customPass || getStoredPassphrase();
    const enc = new TextEncoder();
    const plainBytes = enc.encode(JSON.stringify(data));
    const salt = new Uint8Array(16);
    window.crypto.getRandomValues(salt);
    const iv = new Uint8Array(12);
    window.crypto.getRandomValues(iv);

    const key = await deriveKey(pass, salt);
    const cipherBuffer = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plainBytes);

    return {
      version: 1,
      encrypted: true,
      salt: bufToHex(salt.buffer),
      iv: bufToHex(iv.buffer),
      data: bufToBase64(cipherBuffer),
      timestamp: Date.now()
    };
  } catch (err) {
    return data;
  }
}

async function decryptData(envelope, customPass) {
  if (!envelope || !envelope.encrypted || !envelope.data) return envelope;
  try {
    const pass = customPass || getStoredPassphrase();
    const salt = hexToBuf(envelope.salt);

function formatCountdown(dateStr) {
  if (!dateStr) return '';
  const targetMs = new Date(dateStr).getTime();
  if (isNaN(targetMs)) return '';
  const diffMs = targetMs - Date.now();
  const isOverdue = diffMs < 0;
  const absSec = Math.floor(Math.abs(diffMs) / 1000);
  const d = Math.floor(absSec / 86400);
  const h = Math.floor((absSec % 86400) / 3600);
  const m = Math.floor((absSec % 3600) / 60);
  const s = absSec % 60;
  const parts = [];
  if (d > 0) parts.push(d + 'd');
  if (h > 0 || d > 0) parts.push(h + 'h');
  if (m > 0 || h > 0 || d > 0) parts.push(m + 'm');
  parts.push(s + 's');
  return (isOverdue ? 'Overdue by ' : 'in ') + parts.slice(0, 3).join(' ');
}

function calcTargetFromDuration(y, m, d, h, min, s) {
  const target = new Date();
  if (y) target.setFullYear(target.getFullYear() + Number(y));
  if (m) target.setMonth(target.getMonth() + Number(m));
  if (d) target.setDate(target.getDate() + Number(d));
  if (h) target.setHours(target.getHours() + Number(h));
  if (min) target.setMinutes(target.getMinutes() + Number(min));
  if (s) target.setSeconds(target.getSeconds() + Number(s));
  return target;
}

function triggerAutomatedAssignmentEmail(task, laneName, assignedMember) {
  if (!assignedMember || !assignedMember.email) return;
  const prioText = PRIORITIES[task.priority] || 'Normal';
  const fullDue = formatFullDue(task.due);
  const countdown = formatCountdown(task.due);
  const dueSummary = countdown ? `${fullDue} (${countdown})` : fullDue;

  const emailBody = `Hi ${assignedMember.name},\n\nThe task "${task.title}" in lane "${laneName}" has been assigned to you on board "${state.name}".\n\nDetails:\n- Title: ${task.title}\n- Lane: ${laneName}\n- Due Date: ${dueSummary}\n- Priority: ${prioText}\n\nAutomated notification dispatched for ${assignedMember.email}.`;

  const record = {
    id: uid('em'),
    recipientName: assignedMember.name,
    recipientEmail: assignedMember.email,
    taskTitle: task.title,
    laneName: laneName,
    dueSummary: dueSummary,
    priority: prioText,
    at: new Date().toLocaleTimeString() + ' ' + new Date().toLocaleDateString(),
    status: (emailConfig.publicKey && emailConfig.serviceId && emailConfig.templateId) ? 'Delivering via EmailJS' : 'Simulation Logged',
    body: emailBody
  };

  outbox.unshift(record);
  saveOutbox();

  if (emailConfig.publicKey && emailConfig.serviceId && emailConfig.templateId && window.emailjs) {
    try {
      emailjs.init(emailConfig.publicKey);
      emailjs.send(emailConfig.serviceId, emailConfig.templateId, {
        to_email: assignedMember.email,
        to_name: assignedMember.name,
        task_title: task.title,
        lane_name: laneName,
        due_date: dueSummary,
        priority: prioText,
        board_name: state.name || 'Visual Task Board',
        message: emailBody
      }).then(() => {
        record.status = 'Sent via EmailJS (Success)';
        saveOutbox();
        toast(`Real Email Delivered to ${assignedMember.name} <${assignedMember.email}>!`);
      }).catch((err) => {
        record.status = 'EmailJS Failed: ' + (err.text || err.message);
        saveOutbox();
        toast('EmailJS Failed: ' + (err.text || err.message));
      });
    } catch(err) {
      record.status = 'Error: ' + err.message;
      saveOutbox();
    }
  } else {
    toast(`Automated Email logged for ${assignedMember.name} <${assignedMember.email}>!`);
  }
}

async function loadEncryptedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.encrypted) return await decryptData(parsed);
      return parsed;
    }
  } catch(e) {}
  return initialSeed();
}

async function persistAndSyncState() {
  try {
    const envelope = await encryptData(state);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(envelope));
    lastSyncTimestamp = Date.now();
    if (syncChannel && !isRemoteUpdate) {
      syncChannel.postMessage({
        senderId: clientId,
        envelope,
        timestamp: lastSyncTimestamp
      });
    }
  } catch(e) {
    console.error('Failed saving encrypted state', e);
  }
  render();
}

/* Modals */
function createModal(title, contentEl) {
  const dlg = document.createElement('dialog');
  dlg.className = 'modal-dlg';
  const head = document.createElement('div');
  head.className = 'modal-head';
  head.innerHTML = `<h3 class="modal-title">${title}</h3><button type="button" class="btn" style="height:26px;padding:0 8px;">✕</button>`;
  head.querySelector('button').onclick = () => dlg.close();
  dlg.append(head, contentEl);
  dlg.addEventListener('close', () => dlg.remove());
  document.body.appendChild(dlg);
  dlg.showModal();
  return dlg;
}

function buildTimingPicker(initialIso) {
  let mode = 'duration';
  let targetDate = initialIso ? new Date(initialIso) : calcTargetFromDuration(0, 0, 3, 0, 0, 0);

  const container = document.createElement('div');
  container.className = 'timing-picker-box';

  const tabs = document.createElement('div');
  tabs.className = 'timing-tabs';
  tabs.innerHTML = `
    <button type="button" class="timing-tab active" id="tab-dur">Duration (Y / M / D / H / M / S)</button>
    <button type="button" class="timing-tab" id="tab-dt">Exact Date & Time (incl. Seconds)</button>
  `;

  const durPanel = document.createElement('div');
  durPanel.className = 'duration-grid';
  durPanel.innerHTML = `
    <div><label style="font-size:10px;font-weight:700">Y</label><input type="number" id="td-y" min="0" value="0"></div>
    <div><label style="font-size:10px;font-weight:700">M</label><input type="number" id="td-m" min="0" value="0"></div>
    <div><label style="font-size:10px;font-weight:700">D</label><input type="number" id="td-d" min="0" value="3"></div>
    <div><label style="font-size:10px;font-weight:700">H</label><input type="number" id="td-h" min="0" max="23" value="0"></div>
    <div><label style="font-size:10px;font-weight:700">MIN</label><input type="number" id="td-min" min="0" max="59" value="0"></div>
    <div><label style="font-size:10px;font-weight:700;color:var(--primary)">SEC</label><input type="number" id="td-s" min="0" max="59" value="0" style="border-color:var(--primary)"></div>
  `;

  const dtPanel = document.createElement('div');
  dtPanel.className = 'datetime-grid';
  dtPanel.style.display = 'none';
  dtPanel.innerHTML = `
    <div>
      <label class="form-label">Date (Y-M-D)</label>
      <input type="date" id="td-date" class="form-input" value="${ymd(targetDate)}">
    </div>
    <div>
      <label class="form-label">Time (H:M:S)</label>
      <div style="display:flex;align-items:center;gap:4px;">
        <input type="number" id="td-th" class="form-input" min="0" max="23" value="${pad(targetDate.getHours())}"> :
        <input type="number" id="td-tm" class="form-input" min="0" max="59" value="${pad(targetDate.getMinutes())}"> :
        <input type="number" id="td-ts" class="form-input" min="0" max="59" value="${pad(targetDate.getSeconds())}">
      </div>
    </div>
  `;

  const preview = document.createElement('div');
  preview.style.cssText = 'margin-top:8px;font-size:11px;font-weight:600;display:flex;justify-content:space-between;color:var(--ink-muted);';
  const refreshPreview = () => {
    preview.innerHTML = `Target: <strong>${formatFullDue(targetDate.toISOString())}</strong> <span style="font-family:var(--font-mono)">${formatCountdown(targetDate.toISOString())}</span>`;
  };
  refreshPreview();

  const syncFromDur = () => {
    targetDate = calcTargetFromDuration(
      durPanel.querySelector('#td-y').value, durPanel.querySelector('#td-m').value,
      durPanel.querySelector('#td-d').value, durPanel.querySelector('#td-h').value,
      durPanel.querySelector('#td-min').value, durPanel.querySelector('#td-s').value
    );
    dtPanel.querySelector('#td-date').value = ymd(targetDate);
    dtPanel.querySelector('#td-th').value = pad(targetDate.getHours());
    dtPanel.querySelector('#td-tm').value = pad(targetDate.getMinutes());
    dtPanel.querySelector('#td-ts').value = pad(targetDate.getSeconds());
    refreshPreview();
  };

  const syncFromDt = () => {
    const [y, m, d] = dtPanel.querySelector('#td-date').value.split('-').map(Number);
    targetDate = new Date(y, m - 1, d,
      Number(dtPanel.querySelector('#td-th').value) || 0,
      Number(dtPanel.querySelector('#td-tm').value) || 0,
      Number(dtPanel.querySelector('#td-ts').value) || 0
    );
    refreshPreview();
  };

  tabs.querySelector('#tab-dur').onclick = () => {
    tabs.querySelector('#tab-dur').className = 'timing-tab active';
    tabs.querySelector('#tab-dt').className = 'timing-tab';
    durPanel.style.display = 'grid'; dtPanel.style.display = 'none';
  };
  tabs.querySelector('#tab-dt').onclick = () => {
    tabs.querySelector('#tab-dt').className = 'timing-tab active';
    tabs.querySelector('#tab-dur').className = 'timing-tab';
    dtPanel.style.display = 'grid'; durPanel.style.display = 'none';
  };

  durPanel.querySelectorAll('input').forEach(i => i.addEventListener('input', syncFromDur));
  dtPanel.querySelectorAll('input').forEach(i => i.addEventListener('input', syncFromDt));

  container.append(tabs, durPanel, dtPanel, preview);
  return { el: container, getIso: () => targetDate.toISOString() };
}

  body.querySelector('#btn-add-st').onclick = () => {
    const txt = body.querySelector('#new-st-input').value.trim();
    if (!txt) return;
    if (!card.subtasks) card.subtasks = [];
    card.subtasks.push({ title: txt, done: false });
    dlg.close();
    openCardModal(card.id);
  };

  const save = () => {
    const prevAssignee = card.assigneeId;
    card.title = body.querySelector('#ec-title').value.trim() || card.title;
    card.desc = body.querySelector('#ec-desc').value.trim();
    card.laneId = body.querySelector('#ec-lane').value;
    card.assigneeId = body.querySelector('#ec-who').value;
    card.priority = Number(body.querySelector('#ec-prio').value);
    card.tags = body.querySelector('#ec-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    card.due = timing.getIso();

    (card.subtasks || []).forEach((st, i) => {
      const chk = body.querySelector(`#st-${i}`);
      if (chk) st.done = chk.checked;
    });

    persistAndSyncState();
    if (card.assigneeId && card.assigneeId !== prevAssignee) {
      const assigned = state.members.find(m => m.id === card.assigneeId);
      const lane = state.lanes.find(l => l.id === card.laneId);
      triggerAutomatedAssignmentEmail(card, lane ? lane.name : 'Lane', assigned);

  actions.querySelector('#ec-save').onclick = () => { save(); dlg.close(); };

    const lane = state.lanes.find(l => l.id === card.laneId);
    if (assigned && assigned.email) {
      triggerAutomatedAssignmentEmail(card, lane ? lane.name : 'Lane', assigned);
    } else {
      toast('Please assign this task to an account with an email address.');
    }
  };
  actions.querySelector('#ec-del').onclick = () => {
    state.cards = state.cards.filter(c => c.id !== card.id);
    persistAndSyncState();
    dlg.close();
    toast('Task deleted.');
  };
};

      <button type="submit" class="btn primary">+ Create Member</button>
    </div>
  `;
  const dlg = createModal('Create Member Account', body);
  body.querySelector('#acc-cancel').onclick = () => dlg.close();
  body.onsubmit = (e) => {
    e.preventDefault();
    const name = body.querySelector('#acc-name').value.trim();
    const email = body.querySelector('#acc-email').value.trim();
    if (!name || !email) return;
    const newMember = { id: uid('m'), name, email, color: getUserColor(state.members.length) };
    state.members.push(newMember);
    persistAndSyncState();
    dlg.close();
    toast(`Account created for ${name}!`);
  };
};

window.openProfileModal = () => {
  const body = document.createElement('form');
  body.className = 'modal-body';
  body.innerHTML = `
    <label class="form-label">Your Name<input type="text" id="prof-name" class="form-input" value="${currentUser.name}" required></label>
    <label class="form-label">Your Alert Gmail Address<input type="email" id="prof-email" class="form-input" value="${currentUser.email}" required></label>
    <div class="modal-actions">
      <button type="button" class="btn" id="prof-cancel">Cancel</button>
      <button type="submit" class="btn primary">Save Profile</button>
    </div>
  `;
  const dlg = createModal('User Profile & Notifications', body);
  body.querySelector('#prof-cancel').onclick = () => dlg.close();
  body.onsubmit = (e) => {
    e.preventDefault();
    currentUser.name = body.querySelector('#prof-name').value.trim();
    currentUser.email = body.querySelector('#prof-email').value.trim();
    localStorage.setItem('vtb_user_email', currentUser.email);
    const me = state.members.find(m => m.id === currentUser.id);
    if (me) { me.name = currentUser.name; me.email = currentUser.email; }
    persistAndSyncState();
    dlg.close();
    toast('Profile updated!');
  };
};

window.openEmailConfigModal = () => {
  const body = document.createElement('form');
  body.className = 'modal-body';
  body.innerHTML = `
    <p style="font-size:12px;color:var(--ink-muted);margin:0;">Enter keys from <strong>emailjs.com</strong> to transmit real emails directly to Gmail inboxes:</p>
    <label class="form-label">Public Key<input type="text" id="cfg-pk" class="form-input" value="${emailConfig.publicKey}" placeholder="Public key..."></label>
    <label class="form-label">Service ID<input type="text" id="cfg-sid" class="form-input" value="${emailConfig.serviceId}" placeholder="service_gmail..."></label>
    <label class="form-label">Template ID<input type="text" id="cfg-tid" class="form-input" value="${emailConfig.templateId}" placeholder="template_reminder..."></label>
    <div class="modal-actions">
      <button type="button" class="btn" id="cfg-cancel">Cancel</button>
      <button type="submit" class="btn primary">Save Keys</button>
    </div>
  `;
  const dlg = createModal('EmailJS Live Configuration', body);
  body.querySelector('#cfg-cancel').onclick = () => dlg.close();
  body.onsubmit = (e) => {
    e.preventDefault();
    emailConfig.publicKey = body.querySelector('#cfg-pk').value.trim();
    emailConfig.serviceId = body.querySelector('#cfg-sid').value.trim();
    emailConfig.templateId = body.querySelector('#cfg-tid').value.trim();
    localStorage.setItem('vtb_emailjs_pk', emailConfig.publicKey);
    localStorage.setItem('vtb_emailjs_sid', emailConfig.serviceId);
    localStorage.setItem('vtb_emailjs_tid', emailConfig.templateId);
    dlg.close();
    toast('EmailJS keys saved!');
  };
};

window.openOutboxModal = () => {
  const body = document.createElement('div');
  body.className = 'modal-body';
  if (outbox.length === 0) {
    body.innerHTML = '<p style="text-align:center;padding:24px;color:var(--ink-muted);">No automated emails dispatched yet.</p>';
  } else {
    const list = document.createElement('div');
    list.style.cssText = 'display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto;';
    outbox.forEach(item => {
      const row = document.createElement('div');
      row.style.cssText = 'padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:12px;';
      row.innerHTML = `
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <strong style="color:var(--primary);">${item.recipientName} &lt;${item.recipientEmail}&gt;</strong>
          <span style="font-size:10.5px;color:var(--ink-muted);">${item.at}</span>
        </div>
        <div><strong>Task:</strong> "${item.taskTitle}" in ${item.laneName} • ${item.priority}</div>
        <div style="color:var(--ink-muted);margin-bottom:4px;">Timing: ${item.dueSummary}</div>
        <pre style="margin:0;padding:6px;background:var(--bg);border-radius:4px;font-size:11px;font-family:var(--font-mono);white-space:pre-wrap;">${item.body}</pre>
        <div style="margin-top:4px;font-weight:700;color:${item.status.includes('Success') ? '#166534' : '#b45309'};">Status: ${item.status}</div>
      `;
      list.appendChild(row);
    });
    body.appendChild(list);
  }
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  actions.innerHTML = `
    ${outbox.length > 0 ? '<button type="button" class="btn danger" style="margin-right:auto" id="ob-clear">Clear</button>' : ''}
    <button type="button" class="btn primary" id="ob-close">Close</button>
  `;
  body.appendChild(actions);
  const dlg = createModal(`Automated Outbox Log (${outbox.length})`, body);
  actions.querySelector('#ob-close').onclick = () => dlg.close();
  const clearBtn = actions.querySelector('#ob-clear');
  if (clearBtn) clearBtn.onclick = () => { outbox = []; saveOutbox(); dlg.close(); toast('Outbox cleared.'); };
};

/* JSON Import / Export */
window.exportBoardJSON = () => {
  const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
  const el = document.createElement('a');
  el.setAttribute('href', dataStr);
  el.setAttribute('download', `${state.name.replace(/\s+/g, '_')}_backup.json`);
  document.body.appendChild(el);
  el.click();
  el.remove();
  toast('Board JSON exported!');
};

window.importBoardJSON = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const imported = JSON.parse(event.target.result);
        if (imported && imported.cards && imported.lanes) {
          state = imported;
          persistAndSyncState();
          toast('Board JSON imported successfully!');
        } else {
          toast('Invalid board JSON format.');
        }
      } catch(err) {
        toast('Failed parsing JSON file.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
};

/* Sorting & Swimlanes */
window.changeSorting = (val) => { currentSort = val; renderWorkspace(); };
window.changeSwimlane = (val) => { currentSwimlane = val; renderWorkspace(); };

function sortCards(cards) {
  const c = [...cards];
  if (currentSort === 'prio-desc') return c.sort((a,b) => a.priority - b.priority);
  if (currentSort === 'prio-asc') return c.sort((a,b) => b.priority - a.priority);
  if (currentSort === 'due-asc') return c.sort((a,b) => new Date(a.due || 0) - new Date(b.due || 0));
  if (currentSort === 'title-asc') return c.sort((a,b) => a.title.localeCompare(b.title));
  if (currentSort === 'title-desc') return c.sort((a,b) => b.title.localeCompare(a.title));
  return c;
}

/* Card Timer Toggle */
window.toggleCardTimer = (e, cardId) => {
  e.stopPropagation();
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  card.timerRunning = !card.timerRunning;
  persistAndSyncState();
};

/* Rendering Kanban UI */
function renderAccountsBar() {
  const bar = document.getElementById('accounts-bar');
  if (!bar || !state) return;
  bar.innerHTML = '';

  const title = document.createElement('span');
  title.style.cssText = 'font-size:11px;font-weight:800;color:var(--ink-muted);text-transform:uppercase;';
  title.textContent = `Accounts (${state.members.length}):`;
  bar.appendChild(title);

  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'account-chip' + (filterAccountId === null ? ' active' : '');
  allBtn.textContent = 'All Accounts';
  allBtn.onclick = () => { filterAccountId = null; render(); };
  bar.appendChild(allBtn);

  state.members.forEach((m, idx) => {
    const taskCount = state.cards.filter(c => c.assigneeId === m.id).length;
    const chip = document.createElement('div');
    chip.className = 'account-chip' + (filterAccountId === m.id ? ' active' : '');
    chip.innerHTML = `
      <div class="avatar" style="background:${m.color || getUserColor(idx)}">${m.name.slice(0, 2)}</div>
      <span>${m.name} ${m.id === currentUser.id ? '(You)' : ''}</span>
      <span class="badge">${taskCount}</span>
    `;
    chip.onclick = () => { filterAccountId = filterAccountId === m.id ? null : m.id; render(); };
    bar.appendChild(chip);
  });

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'add-acc-btn';
  addBtn.textContent = '+ Create Account';
  addBtn.onclick = () => openCreateAccountModal();
  bar.appendChild(addBtn);
}

function renderWorkspace() {
  const workspace = document.getElementById('workspace');
  if (!workspace || !state) return;
  workspace.innerHTML = '';

  let swimlaneGroups = [{ id: 'all', title: '', filter: () => true }];
  if (currentSwimlane === 'assignee') {
    swimlaneGroups = state.members.map(m => ({
      id: m.id, title: `Assignee: ${m.name}`, filter: (c) => c.assigneeId === m.id
    }));
    swimlaneGroups.push({ id: 'unassigned', title: 'Unassigned Tasks', filter: (c) => !c.assigneeId });
  } else if (currentSwimlane === 'priority') {
    swimlaneGroups = [1, 2, 3, 4].map(p => ({
      id: String(p), title: `Priority: ${PRIORITIES[p]}`, filter: (c) => c.priority === p
    }));
  }

  swimlaneGroups.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'swimlane-container';
    if (group.title) {
      const st = document.createElement('div');
      st.className = 'swimlane-title';
      st.textContent = group.title;
      groupEl.appendChild(st);
    }

    const grid = document.createElement('div');
    grid.className = 'kanban-grid';

    state.lanes.forEach(lane => {
      let laneCards = state.cards.filter(c => c.laneId === lane.id && group.filter(c) && (!filterAccountId || c.assigneeId === filterAccountId));
      laneCards = sortCards(laneCards);

      const laneEl = document.createElement('div');
      laneEl.className = 'lane';

      const isOverLimit = lane.limit > 0 && laneCards.length > lane.limit;
      const head = document.createElement('div');
      head.className = 'lane-head';
      head.innerHTML = `
        <h3 class="lane-title">
          ${lane.name}
          <span class="lane-count">${laneCards.length}${lane.limit > 0 ? ' / ' + lane.limit : ''}</span>
          ${isOverLimit ? '<span class="lane-wip-warn">(Exceeded)</span>' : ''}
        </h3>
        <button type="button" class="btn" style="height:24px;padding:0 7px;font-size:11px;">+ Add</button>
      `;
      head.querySelector('button').onclick = () => openNewTaskModal(lane.id);
      laneEl.appendChild(head);

      const list = document.createElement('div');
      list.className = 'lane-cards';
      list.dataset.laneId = lane.id;

      list.ondragover = (e) => { e.preventDefault(); list.classList.add('drop-active'); };
      list.ondragleave = () => { list.classList.remove('drop-active'); };
      list.ondrop = (e) => {
        e.preventDefault();
        list.classList.remove('drop-active');
        const cardId = e.dataTransfer.getData('text/plain');
        const card = state.cards.find(c => c.id === cardId);
        if (card && card.laneId !== lane.id) {
          card.laneId = lane.id;
          persistAndSyncState();
          toast(`Task moved to ${lane.name}`);
        }
      };

      laneCards.forEach(c => {
        const assigneeIdx = state.members.findIndex(m => m.id === c.assigneeId);
        const assignee = state.members[assigneeIdx];
        const countdown = formatCountdown(c.due);
        const isOverdue = countdown.includes('Overdue');

        const cardEl = document.createElement('article');
        cardEl.className = 'task-card';
        cardEl.draggable = true;
        cardEl.ondragstart = (e) => { e.dataTransfer.setData('text/plain', c.id); };
        cardEl.onclick = () => openCardModal(c.id);

        const subtasksTotal = (c.subtasks || []).length;
        const subtasksDone = (c.subtasks || []).filter(s => s.done).length;
        const subtaskPct = subtasksTotal > 0 ? Math.round((subtasksDone / subtasksTotal) * 100) : 0;

        const timerMinutes = Math.floor((c.timerSeconds || 0) / 60);
        const timerSecs = (c.timerSeconds || 0) % 60;
        const timerFormatted = `${pad(timerMinutes)}:${pad(timerSecs)}`;

        cardEl.innerHTML = `
          ${c.tags && c.tags.length ? `
            <div class="card-tags">
              ${c.tags.map(t => `<span class="tag-badge tag-${t.toLowerCase()}">${t}</span>`).join('')}
            </div>
          ` : ''}
          <h4 class="card-title">${c.title}</h4>

          ${subtasksTotal > 0 ? `
            <div class="card-subtasks">
              <div style="font-size:10px;font-weight:700;color:var(--ink-muted);display:flex;justify-content:space-between;">
                <span>Sub-tasks ${subtasksDone}/${subtasksTotal}</span>
                <span>${subtaskPct}%</span>
              </div>
              <div class="subtasks-bar"><div class="subtasks-fill" style="width:${subtaskPct}%"></div></div>
            </div>
          ` : ''}

          <div class="card-meta">
            <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
              <span class="prio-badge p${c.priority}">${PRIORITIES[c.priority]?.split(' ')[0]}</span>
              ${c.due ? `<span class="due-badge ${isOverdue ? 'overdue' : ''}">🕒 ${countdown}</span>` : ''}
              <button type="button" class="timer-btn ${c.timerRunning ? 'running' : ''}" onclick="toggleCardTimer(event, '${c.id}')">
                ⏱️ ${c.timerRunning ? 'Stop' : 'Start'} ${timerFormatted}
              </button>
            </div>
            <div>
              ${assignee ? `<div class="avatar" style="background:${assignee.color || getUserColor(assigneeIdx)}" title="${assignee.name}">${assignee.name.slice(0, 2)}</div>` : '<span style="color:var(--ink-muted);font-size:10px;">Unassigned</span>'}
            </div>
          </div>
        `;
        list.appendChild(cardEl);
      });

      laneEl.appendChild(list);
      grid.appendChild(laneEl);
    });

    groupEl.appendChild(grid);
    workspace.appendChild(groupEl);
  });
}

function render() {
  const boardTitle = document.getElementById('board-title');
  if (boardTitle && state) boardTitle.textContent = state.name;
  const bannerUser = document.getElementById('banner-user-display');
  if (bannerUser) bannerUser.textContent = `${currentUser.name} <${currentUser.email}>`;
  saveOutbox();
  renderAccountsBar();
  renderWorkspace();
}

/* Timer Interval for Running Tasks & Live Second Countdowns */
setInterval(() => {
  let changed = false;
  if (state && state.cards) {
    state.cards.forEach(c => {
      if (c.timerRunning) {
        c.timerSeconds = (c.timerSeconds || 0) + 1;
        changed = true;
      }
    });
  }
  // Re-render lane countdowns and timers every second
  renderWorkspace();
  if (changed) {
    // Throttle local save on timer ticks
    try {
      encryptData(state).then(envelope => localStorage.setItem(STORAGE_KEY, JSON.stringify(envelope)));
    } catch(e) {}
  }
}, 1000);

/* App Init */
(async () => {
  state = await loadEncryptedState();
  render();
})();

})();
</script>
</body>
