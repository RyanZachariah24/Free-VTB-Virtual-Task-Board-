/* ---------- Web Crypto AES-256-GCM Zero-Knowledge Vault ---------- */
function bufToHex(buffer) {
  const bytes = new Uint8Array(buffer);
  let hex = '';
  for (let i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
  return hex;
}
function hexToBuf(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
  return bytes;
}
function bufToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return window.btoa(binary);
}
function base64ToBuf(base64) {
  const binary = window.atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function getStoredPassphrase() {
  let saved = localStorage.getItem(VAULT_KEY_STORAGE);
  if (!saved) {
    const randomBytes = new Uint8Array(24);
    window.crypto.getRandomValues(randomBytes);
    saved = bufToHex(randomBytes.buffer);
    localStorage.setItem(VAULT_KEY_STORAGE, saved);
  }
  return saved;
}

async function deriveKey(passphrase, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await window.crypto.subtle.importKey(
    'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return window.crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptData(data, customPass) {
  const pass = customPass || getStoredPassphrase();
  const enc = new TextEncoder();
  const plainBytes = enc.encode(JSON.stringify(data));
  const salt = new Uint8Array(16);
  window.crypto.getRandomValues(salt);
  const iv = new Uint8Array(12);
  window.crypto.getRandomValues(iv);

  const key = await deriveKey(pass, salt);
  const cipherBuffer = await window.crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, key, plainBytes
  );

  return {
    version: 1,
    encrypted: true,
    salt: bufToHex(salt.buffer),
    iv: bufToHex(iv.buffer),
    data: bufToBase64(cipherBuffer),
    timestamp: Date.now()
  };
}

async function decryptData(envelope, customPass) {
  if (!envelope || !envelope.encrypted || !envelope.data) return envelope;
  const pass = customPass || getStoredPassphrase();
  const salt = hexToBuf(envelope.salt);
  const iv = hexToBuf(envelope.iv);
  const cipherBytes = base64ToBuf(envelope.data);

  const key = await deriveKey(pass, salt);
  const plainBuffer = await window.crypto.subtle.decrypt(
    { name: 'AES-GCM', iv }, key, cipherBytes
  );
  const dec = new TextDecoder();
  return JSON.parse(dec.decode(plainBuffer));
}

/* ---------- Real-Time Auto-Sync Engine (BroadcastChannel API) ---------- */

function calcTargetFromDuration(y, m, d, h, min, s) {
  const target = new Date();
  if (y) target.setFullYear(target.getFullYear() + Number(y));
  if (m) target.setMonth(target.getMonth() + Number(m));
  if (d) target.setDate(target.getDate() + Number(d));
  if (h) target.setHours(target.getHours() + Number(h));
  if (min) target.setMinutes(target.getMinutes() + Number(min));
  if (s) target.setSeconds(target.getSeconds() + Number(s));
  return target;
}

function formatFullDue(dateStr) {
  if (!dateStr) return 'No due date';
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
    });
  } catch(e) { return dateStr; }
}

function formatCountdown(dateStr) {
  if (!dateStr) return '';
  const targetMs = new Date(dateStr).getTime();
  if (isNaN(targetMs)) return '';
  const diffMs = targetMs - Date.now();
  const isOverdue = diffMs < 0;
  const absSec = Math.floor(Math.abs(diffMs) / 1000);
  const d = Math.floor(absSec / 86400);
  const h = Math.floor((absSec % 86400) / 3600);
  const m = Math.floor((absSec % 3600) / 60);
  const s = absSec % 60;
  const parts = [];
  if (d > 0) parts.push(d + 'd');
  if (h > 0 || d > 0) parts.push(h + 'h');
  if (m > 0 || h > 0 || d > 0) parts.push(m + 'm');
  parts.push(s + 's');
  return (isOverdue ? 'Overdue by ' : 'in ') + parts.slice(0, 3).join(' ');
}

}

function triggerAutomatedAssignmentEmail(task, laneName, assignedMember) {
  if (!assignedMember || !assignedMember.email) return;
  const prioText = PRIORITIES[task.priority] || 'Normal';
  const fullDue = formatFullDue(task.due);
  const countdown = formatCountdown(task.due);
  const dueSummary = countdown ? `${fullDue} (${countdown})` : fullDue;

  const emailBody = `Hi ${assignedMember.name},\n\nThe task "${task.title}" in lane "${laneName}" has been assigned to you on board "${state.name}".\n\nDetails:\n- Title: ${task.title}\n- Lane: ${laneName}\n- Due Date: ${dueSummary}\n- Priority: ${prioText}\n\nAutomated notification dispatched for ${assignedMember.email}.`;

  const record = {
    id: uid('em'),
    recipientName: assignedMember.name,
    recipientEmail: assignedMember.email,
    taskTitle: task.title,
    laneName: laneName,
    dueSummary: dueSummary,
    priority: prioText,
    at: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + new Date().toLocaleDateString(),
    status: (emailConfig.publicKey && emailConfig.serviceId && emailConfig.templateId) ? 'Delivering via EmailJS' : 'Simulation Logged',
    body: emailBody
  };

  outbox.unshift(record);
  saveOutbox();

  if (emailConfig.publicKey && emailConfig.serviceId && emailConfig.templateId && window.emailjs) {
    try {
      emailjs.init(emailConfig.publicKey);
      emailjs.send(emailConfig.serviceId, emailConfig.templateId, {
        to_email: assignedMember.email,
        to_name: assignedMember.name,
        user_name: assignedMember.name,
        task_title: task.title,
        lane_name: laneName,
        due_date: dueSummary,
        priority: prioText,
        board_name: state.name || 'Visual Task Board',
        description: task.desc || 'No description provided.',
        message: emailBody
      }).then(() => {
        record.status = 'Sent via EmailJS (Success)';
        saveOutbox();
        toast(`Real Email Delivered to ${assignedMember.name} <${assignedMember.email}>!`);
      }).catch((err) => {
        record.status = 'EmailJS Failed: ' + (err.text || err.message);
        saveOutbox();
        toast('EmailJS Failed: ' + (err.text || err.message));
      });
    } catch(err) {
      record.status = 'Error: ' + err.message;
      saveOutbox();
    }
  } else {
    toast(`Automated Email logged for ${assignedMember.name} <${assignedMember.email}>!`);
  }
}

async function loadEncryptedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.encrypted) {
        return await decryptData(parsed);
      }
      return parsed;
    }
  } catch(e) {}
  return initialSeed();
}

async function persistAndSyncState() {
  try {
    const envelope = await encryptData(state);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(envelope));
    lastSyncTimestamp = Date.now();
    if (syncChannel && !isRemoteUpdate) {
      syncChannel.postMessage({
        senderId: clientId,
        envelope,
        timestamp: lastSyncTimestamp
      });
    }
  } catch(e) {
    console.error('Failed saving encrypted state', e);
  }
  render();
}

function buildTimingPicker(initialIso) {
  let mode = 'duration';
  let targetDate = initialIso ? new Date(initialIso) : calcTargetFromDuration(0, 0, 3, 0, 0, 0);

  const container = document.createElement('div');
  container.className = 'timing-picker-box';

  const tabs = document.createElement('div');
  tabs.className = 'timing-tabs';
  const tabDur = document.createElement('button');
  tabDur.type = 'button';
  tabDur.className = 'timing-tab active';
  tabDur.textContent = 'In Duration (Y / M / D / H / M / S)';
  const tabDt = document.createElement('button');
  tabDt.type = 'button';
  tabDt.className = 'timing-tab';
  tabDt.textContent = 'Exact Date & Time (incl. Seconds)';
  tabs.append(tabDur, tabDt);

  const durPanel = document.createElement('div');
  durPanel.className = 'duration-grid';
  durPanel.innerHTML = `
    <div class="dur-col"><label>Years</label><input type="number" id="td-y" min="0" value="0"></div>
    <div class="dur-col"><label>Months</label><input type="number" id="td-m" min="0" value="0"></div>
    <div class="dur-col"><label>Days</label><input type="number" id="td-d" min="0" value="3"></div>
    <div class="dur-col"><label>Hours</label><input type="number" id="td-h" min="0" max="23" value="0"></div>
    <div class="dur-col"><label>Minutes</label><input type="number" id="td-min" min="0" max="59" value="0"></div>
    <div class="dur-col"><label style="color:var(--board)">Seconds*</label><input type="number" id="td-s" class="sec-field" min="0" max="59" value="0"></div>
  `;

  const dtPanel = document.createElement('div');
  dtPanel.className = 'datetime-grid';
  dtPanel.style.display = 'none';
  dtPanel.innerHTML = `
    <div>
      <label style="font-size:11px;font-weight:700;color:var(--ink-2);margin-bottom:4px;display:block;">Date (Y-M-D)</label>
      <input type="date" id="td-date" class="form-input" value="${ymd(targetDate)}">
    </div>
    <div>
      <label style="font-size:11px;font-weight:700;color:var(--ink-2);margin-bottom:4px;display:block;">Time (H : M : S)</label>
      <div class="time-sec-row">
        <input type="number" id="td-th" min="0" max="23" value="${pad(targetDate.getHours())}"> :
        <input type="number" id="td-tm" min="0" max="59" value="${pad(targetDate.getMinutes())}"> :
        <input type="number" id="td-ts" min="0" max="59" value="${pad(targetDate.getSeconds())}" style="border-color:var(--board);color:var(--board)">
      </div>
    </div>
  `;

  const preview = document.createElement('div');
  preview.className = 'timing-preview';
  const refreshPreview = () => {
    preview.innerHTML = `
      <span>Target: <strong>${formatFullDue(targetDate.toISOString())}</strong></span>
      <span style="font-family:var(--font-mono);font-weight:700;">${formatCountdown(targetDate.toISOString())}</span>
    `;
  };
  refreshPreview();

  const syncFromDur = () => {
    targetDate = calcTargetFromDuration(
      durPanel.querySelector('#td-y').value,
      durPanel.querySelector('#td-m').value,
      durPanel.querySelector('#td-d').value,
      durPanel.querySelector('#td-h').value,
      durPanel.querySelector('#td-min').value,
      durPanel.querySelector('#td-s').value
    );
    dtPanel.querySelector('#td-date').value = ymd(targetDate);
    dtPanel.querySelector('#td-th').value = pad(targetDate.getHours());
    dtPanel.querySelector('#td-tm').value = pad(targetDate.getMinutes());
    dtPanel.querySelector('#td-ts').value = pad(targetDate.getSeconds());
    refreshPreview();
  };

  const syncFromDt = () => {
    const [y, m, d] = dtPanel.querySelector('#td-date').value.split('-').map(Number);
    targetDate = new Date(y, m - 1, d,
      Number(dtPanel.querySelector('#td-th').value) || 0,
      Number(dtPanel.querySelector('#td-tm').value) || 0,
      Number(dtPanel.querySelector('#td-ts').value) || 0
    );
    refreshPreview();
  };

  tabDur.onclick = () => {
    mode = 'duration';
    tabDur.className = 'timing-tab active';
    tabDt.className = 'timing-tab';
    durPanel.style.display = 'grid';
    dtPanel.style.display = 'none';
  };
  tabDt.onclick = () => {
    mode = 'datetime';
    tabDt.className = 'timing-tab active';
    tabDur.className = 'timing-tab';
    dtPanel.style.display = 'grid';
    durPanel.style.display = 'none';
  };

  durPanel.querySelectorAll('input').forEach(i => i.addEventListener('input', syncFromDur));
  dtPanel.querySelectorAll('input').forEach(i => i.addEventListener('input', syncFromDt));

  container.append(tabs, durPanel, dtPanel, preview);
  return {
    el: container,
    getIso: () => targetDate.toISOString()
  };
}

  const body = document.createElement('div');
  body.className = 'modal-body';
  if (outbox.length === 0) {
    body.innerHTML = '<p style="text-align:center;padding:30px;color:var(--ink-3);">No automated emails dispatched yet. Assign any task to an account with an email address to see automated notification records here!</p>';
  } else {
    const list = document.createElement('div');
    list.style.cssText = 'display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;';
    outbox.forEach(item => {
      const row = document.createElement('div');
      row.style.cssText = 'padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);';
      row.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <strong style="color:var(--board);font-size:13px;">To: ${item.recipientName} &lt;${item.recipientEmail}&gt;</strong>
          <span style="font-size:11px;color:var(--ink-3);">${item.at}</span>
        </div>
        <div style="font-weight:600;font-size:13px;margin-bottom:4px;">Task: "${item.taskTitle}" in lane "${item.laneName}" • ${item.priority}</div>
        <div style="font-size:12px;color:var(--ink-2);margin-bottom:6px;">Due Timing: ${item.dueSummary}</div>
        <pre style="margin:0;padding:8px 10px;background:var(--hover);border-radius:6px;font-size:11.5px;font-family:var(--font-mono);white-space:pre-wrap;line-height:1.4;">${item.body}</pre>
        <div style="margin-top:6px;font-size:11.5px;font-weight:700;color:${item.status.includes('Success') || item.status.includes('Sent') ? '#166534' : '#b45309'};">
          Status: ${item.status}
        </div>
      `;
      list.appendChild(row);
    });
    body.appendChild(list);
  }
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  actions.innerHTML = `
    ${outbox.length > 0 ? '<button type="button" class="btn danger" style="margin-right:auto" id="ob-clear">Clear Outbox</button>' : ''}
    <button type="button" class="btn primary" id="ob-close">Close</button>
  `;
  body.appendChild(actions);
  const dlg = createModal(`Automated Outbox Log (${outbox.length})`, body);
  actions.querySelector('#ob-close').onclick = () => dlg.close();
  const clearBtn = actions.querySelector('#ob-clear');
  if (clearBtn) {
    clearBtn.onclick = () => {
      outbox = [];
      saveOutbox();
      dlg.close();
      toast('Outbox cleared.');
    };
  }
};

/* Rendering Kanban UI */
function renderAccountsBar() {
  const bar = document.getElementById('accounts-bar');
  if (!bar || !state) return;
  bar.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'accounts-label';
  title.innerHTML = `👥 Accounts (${state.members.length}):`;
  bar.appendChild(title);

  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'account-chip' + (filterAccountId === null ? ' active' : '');
  allBtn.textContent = 'All Accounts';
  allBtn.onclick = () => { filterAccountId = null; render(); };
  bar.appendChild(allBtn);

  state.members.forEach(m => {
    const taskCount = state.cards.filter(c => c.assigneeId === m.id).length;
    const chip = document.createElement('div');
    chip.className = 'account-chip' + (filterAccountId === m.id ? ' active' : '');
    chip.innerHTML = `
      <div class="avatar">${m.name.slice(0, 2)}</div>
      <span>${m.name} ${m.id === currentUser.id ? '(You)' : ''}</span>
      <span class="email-tag">${m.email || 'No email'}</span>
      <span class="badge">${taskCount} task${taskCount === 1 ? '' : 's'}</span>
    `;
    chip.onclick = () => {
      filterAccountId = filterAccountId === m.id ? null : m.id;
      render();
    };
    bar.appendChild(chip);
  });

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'add-acc-chip';
  addBtn.textContent = '+ Create Account';
  addBtn.onclick = () => openCreateAccountModal();
  bar.appendChild(addBtn);
}

function renderLanes() {
  const grid = document.getElementById('kanban-grid');
  if (!grid || !state) return;
  grid.innerHTML = '';

  state.lanes.forEach(lane => {
    const laneCards = state.cards.filter(c => c.laneId === lane.id && (!filterAccountId || c.assigneeId === filterAccountId));
    const laneEl = document.createElement('div');
    laneEl.className = 'lane';

    const head = document.createElement('div');
    head.className = 'lane-head';
    head.innerHTML = `
      <h3 class="lane-title">${lane.name} <span class="lane-count">${laneCards.length}</span></h3>
      <button type="button" class="btn" style="height:26px;padding:0 8px;font-size:12px;">+ Add</button>
    `;
    head.querySelector('button').onclick = () => openNewTaskModal(lane.id);
    laneEl.appendChild(head);

    const list = document.createElement('div');
    list.className = 'lane-cards';
    list.dataset.laneId = lane.id;

    list.ondragover = (e) => {
      e.preventDefault();
      list.classList.add('drop-active');
    };
    list.ondragleave = () => {
      list.classList.remove('drop-active');
    };
    list.ondrop = (e) => {
      e.preventDefault();
      list.classList.remove('drop-active');
      const cardId = e.dataTransfer.getData('text/plain');
      if (!cardId) return;
      const card = state.cards.find(c => c.id === cardId);
      if (card && card.laneId !== lane.id) {
        card.laneId = lane.id;
        persistAndSyncState();
        toast(`Task "${card.title}" moved to ${lane.name}`);
      }
    };

    laneCards.forEach(c => {
      const assignee = state.members.find(m => m.id === c.assigneeId);
      const countdown = formatCountdown(c.due);
      const isOverdue = countdown.includes('Overdue');

      const cardEl = document.createElement('article');
      cardEl.className = 'task-card';
      cardEl.draggable = true;
      cardEl.ondragstart = (e) => {
        e.dataTransfer.setData('text/plain', c.id);
      };
      cardEl.onclick = () => openCardModal(c.id);

      cardEl.innerHTML = `
        <h4 class="card-title">${c.title}</h4>
        <div class="card-meta">
          <div class="meta-left">
            <span class="prio-badge p${c.priority}">${PRIORITIES[c.priority]?.split(' ')[0] || 'P' + c.priority}</span>
            ${c.due ? `<span class="due-badge ${isOverdue ? 'overdue' : ''}">🕒 ${countdown}</span>` : ''}
          </div>
          <div>
            ${assignee ? `<div class="avatar" title="${assignee.name} (${assignee.email})">${assignee.name.slice(0, 2)}</div>` : '<span style="color:var(--ink-3);font-size:11px;">Unassigned</span>'}
          </div>
        </div>
      `;
      list.appendChild(cardEl);
    });

    laneEl.appendChild(list);
    grid.appendChild(laneEl);
  });
}

function render() {
  const bannerUser = document.getElementById('banner-user-display');
  if (bannerUser) bannerUser.textContent = `${currentUser.name} <${currentUser.email}>`;
  saveOutbox();
  renderAccountsBar();
  renderLanes();
}

/* Initialization with Async Vault Decryption */
(async () => {
  state = await loadEncryptedState();
  render();

  setInterval(() => {
    renderLanes();
  }, 5000);
})();

})();
</script>
</body>
</html>
