    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js", { scope: "/" })
            .catch(function (err) {
              console.warn("[VTB SW] Registration failed:", err);
            });
        });
      }

      // Synchronous localStorage hook buffers early writes before cloud engine finishes loading
      (function () {
        const origSet = localStorage.setItem.bind(localStorage);
        window.__vtbOrigSetItem = origSet;
        window.__vtbPendingWrites = [];
        localStorage.setItem = function (k, v) {
          origSet(k, v);
          try {
            if (typeof window.__vtbOnLocalWrite === "function") {
              window.__vtbOnLocalWrite(k, v);
            } else {
              const idx = window.__vtbPendingWrites.findIndex(function (item) {
                return item[0] === k;
              });
              if (idx >= 0) window.__vtbPendingWrites[idx] = [k, v];
              else window.__vtbPendingWrites.push([k, v]);
            }
          } catch (err) {
            console.warn("[VTB Sync Hook] Non-fatal error:", err);
          }
        };

        // Global early snooze checker
        window.__vtbIsSnoozed = function () {
          try {
            var u = Number(localStorage.getItem("vtb_pro_v8_ask_in_until") || 0);
            return u > 0 && Date.now() < u;
          } catch (e) {
            return false;
          }
        };
      })();
    </script>
